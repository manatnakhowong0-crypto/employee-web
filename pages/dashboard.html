<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เช็คคนมาวันนี้ — ระบบพนักงาน</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/pages.css">
  <style>
    /* ── Today grid ────────────────────────────────────────── */
    .today-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
      padding: 20px;
    }

    .emp-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all .2s;
      position: relative;
      overflow: hidden;
    }
    .emp-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .emp-card.status-ontime::before { background: var(--green); }
    .emp-card.status-late::before   { background: var(--yellow); }
    .emp-card.status-half::before   { background: var(--orange); }
    .emp-card.status-absent::before { background: var(--red); }

    .emp-card.status-absent {
      background: #fef2f2;
      border-color: #fecaca;
    }
    .emp-card.status-ontime { border-color: #bbf7d0; }
    .emp-card.status-late   { border-color: #fef08a; }
    .emp-card.status-half   { border-color: #fed7aa; }

    .emp-avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 15px; flex-shrink: 0;
      color: var(--blue);
    }
    .status-ontime .emp-avatar { background: #dcfce7; }
    .status-late   .emp-avatar { background: #fef9c3; }
    .status-half   .emp-avatar { background: #ffedd5; }
    .status-absent .emp-avatar { background: #fee2e2; }

    .emp-info { flex: 1; min-width: 0; }
    .emp-name { font-size: 13px; font-weight: 700; color: var(--blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .emp-time { font-size: 12px; color: var(--muted); margin-top: 1px; }

    .emp-status-badge {
      font-size: 10px; font-weight: 700; padding: 2px 7px;
      border-radius: 10px; flex-shrink: 0;
    }
    .status-ontime .emp-status-badge { background: #dcfce7; color: #16a34a; }
    .status-late   .emp-status-badge { background: #fef9c3; color: #a16207; }
    .status-half   .emp-status-badge { background: #ffedd5; color: #c2410c; }
    .status-absent .emp-status-badge { background: #fee2e2; color: #dc2626; }

    /* ── Summary strip ──────────────────────────────────────── */
    .today-summary {
      display: flex; gap: 0;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }
    .summary-chip {
      flex: 1; text-align: center;
      padding: 14px 8px;
      border-right: 1px solid var(--border);
      font-size: 13px;
    }
    .summary-chip:last-child { border-right: none; }
    .summary-chip .chip-num {
      font-size: 26px; font-weight: 800;
      line-height: 1; display: block; margin-bottom: 3px;
    }
    .summary-chip .chip-label { font-size: 11px; color: var(--muted); }
    .chip-green  .chip-num { color: var(--green); }
    .chip-yellow .chip-num { color: var(--yellow); }
    .chip-orange .chip-num { color: var(--orange); }
    .chip-red    .chip-num { color: var(--red); }
    .chip-blue   .chip-num { color: var(--blue); }

    /* ── Filter bar ─────────────────────────────────────────── */
    .filter-bar {
      display: flex; gap: 8px; padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-wrap: wrap;
    }
    .filter-btn {
      padding: 6px 14px; border-radius: 20px;
      border: 1.5px solid var(--border);
      background: none; cursor: pointer;
      font-family: inherit; font-size: 12px; font-weight: 600;
      color: var(--muted); transition: all .2s;
    }
    .filter-btn.active          { background: var(--blue); border-color: var(--blue); color: #fff; }
    .filter-btn.f-ontime.active { background: var(--green);  border-color: var(--green); }
    .filter-btn.f-late.active   { background: var(--yellow); border-color: var(--yellow); color: #000; }
    .filter-btn.f-half.active   { background: var(--orange); border-color: var(--orange); }
    .filter-btn.f-absent.active { background: var(--red);    border-color: var(--red); }

    /* ── Auto-refresh indicator ─────────────────────────────── */
    .live-dot {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
    }
    .live-dot::before {
      content: '';
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: livePulse 1.5s ease-in-out infinite;
    }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--muted);
    }
    .empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; display: block; }

    /* ── Advance summary section ──────────────────────────── */
    .advance-section {
      margin-top: 28px;
    }
    .advance-section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: #1e3a5f;
      border-radius: 12px 12px 0 0;
      color: #fff;
    }
    .advance-section-header h2 {
      font-size: 15px; font-weight: 700; margin: 0;
    }
    .advance-total-badge {
      background: rgba(255,255,255,.15);
      padding: 4px 14px; border-radius: 20px;
      font-size: 13px; font-weight: 700;
    }
    .advance-table-wrap { overflow-x: auto; }
    .advance-table {
      width: 100%; border-collapse: collapse;
      font-size: 13px; background: #fff;
      border-radius: 0 0 12px 12px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }
    .advance-table th {
      background: #f8fafc; color: #475569;
      font-weight: 700; font-size: 11px;
      padding: 10px 16px; text-align: left;
      border-bottom: 2px solid #e2e8f0;
      white-space: nowrap;
    }
    .advance-table td {
      padding: 11px 16px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    .advance-table tr:last-child td { border-bottom: none; }
    .advance-table tr:hover td { background: #f8fafc; }
    .adv-name-cell {
      display: flex; align-items: center; gap: 10px;
    }
    .adv-avatar {
      width: 32px; height: 32px; border-radius: 50%;
      background: #dbeafe; color: #1e3a5f;
      font-size: 13px; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .adv-amount-cell {
      font-weight: 800; color: #1e3a5f; text-align: right;
    }
    .adv-count-badge {
      display: inline-block;
      background: #dbeafe; color: #1e40af;
      border-radius: 12px; padding: 2px 9px;
      font-size: 11px; font-weight: 700;
    }
    .adv-bar-wrap {
      width: 120px; background: #f1f5f9;
      border-radius: 6px; height: 8px; overflow: hidden;
    }
    .adv-bar-fill {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #1e3a5f, #3b82f6);
      transition: width .4s ease;
    }
    .adv-empty {
      text-align: center; padding: 40px 20px;
      color: #94a3b8; font-size: 13px;
      background: #fff; border-radius: 0 0 12px 12px;
    }
    .adv-empty-icon { font-size: 36px; display: block; margin-bottom: 8px; }
  </style>
</head>
<body>
<script src="../js/config.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/shell.js"></script>
<script src="../js/api.js"></script>


<div class="app-shell">
  <!-- ── SIDEBAR ── -->
  <div id="sidebar-mount"></div>

  <!-- ── MAIN ── -->
  <div class="main-content">
    <header class="topbar">
      <div class="topbar-title">👥 คนมาวันนี้</div>
      <div class="topbar-right">
        <span class="live-dot">อัปเดตอัตโนมัติ</span>
        <span class="topbar-auth" id="topbar-auth"></span>
        <button class="refresh-btn" id="refresh-btn" onclick="loadData(true)">🔄 อัปเดต</button>
      </div>
    </header>

    <main class="page-content">
      <div class="page-header">
        <h1 id="today-heading">วันนี้</h1>
        <p id="today-subheading">กำลังโหลด...</p>
      </div>

      <!-- Card panel -->
      <div class="table-wrap">

        <!-- Summary strip -->
        <div class="today-summary" id="today-summary">
          <div class="summary-chip chip-green">
            <span class="chip-num" id="cnt-ontime">—</span>
            <span class="chip-label">✅ มาปกติ</span>
          </div>
          <div class="summary-chip chip-yellow">
            <span class="chip-num" id="cnt-late">—</span>
            <span class="chip-label">⏰ มาสาย</span>
          </div>
          <div class="summary-chip chip-orange">
            <span class="chip-num" id="cnt-half">—</span>
            <span class="chip-label">🟠 ครึ่งวัน</span>
          </div>
          <div class="summary-chip chip-red">
            <span class="chip-num" id="cnt-absent">—</span>
            <span class="chip-label">❌ ยังไม่มา</span>
          </div>
          <div class="summary-chip chip-blue">
            <span class="chip-num" id="cnt-total">—</span>
            <span class="chip-label">👥 ทั้งหมด</span>
          </div>
        </div>

        <!-- Filter buttons -->
        <div class="filter-bar" id="filter-bar">
          <button class="filter-btn active" onclick="setFilter('all', this)">ทั้งหมด</button>
          <button class="filter-btn f-ontime" onclick="setFilter('ontime', this)">✅ มาปกติ</button>
          <button class="filter-btn f-late"   onclick="setFilter('late', this)">⏰ มาสาย</button>
          <button class="filter-btn f-half"   onclick="setFilter('half', this)">🟠 ครึ่งวัน</button>
          <button class="filter-btn f-absent" onclick="setFilter('absent', this)">❌ ยังไม่มา</button>
        </div>

        <!-- Employee cards -->
        <div class="today-grid" id="today-grid">
          <div style="grid-column:1/-1;text-align:center;color:#888;padding:40px">⏳ กำลังโหลด...</div>
        </div>

      </div>

      <!-- ── Advance Summary ──────────────────────────────── -->
      <div class="advance-section">
        <div class="advance-section-header">
          <h2>💵 สรุปการเบิกเงินล่วงหน้า</h2>
          <span class="advance-total-badge" id="adv-grand-total">รวม ฿0</span>
        </div>
        <div class="advance-table-wrap">
          <table class="advance-table" id="adv-summary-table">
            <thead>
              <tr>
                <th>พนักงาน</th>
                <th style="text-align:center">จำนวนครั้ง</th>
                <th style="text-align:right">ยอดรวม (บาท)</th>
                <th>สัดส่วน</th>
                <th>ล่าสุด</th>
              </tr>
            </thead>
            <tbody id="adv-summary-body">
              <tr><td colspan="5" class="adv-empty">
                <span class="adv-empty-icon">💸</span>
                ยังไม่มีข้อมูลการเบิกเงินในเซสชันนี้<br>
                <span style="font-size:11px;color:#cbd5e1">ไปที่หน้า "เบิกเงินล่วงหน้า" เพื่อบันทึกคำขอ</span>
              </td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<script>
  Shell.mount({ active: "today" });

  // ── State ─────────────────────────────────────────────────
  let _allCards    = [];
  let _knownNames  = [];
  let _activeFilter = "all";
  let _advances    = [];   // รายการเบิกเงินล่วงหน้าจากชีต

  // ── Status helper ─────────────────────────────────────────
  function getStatus(minuteOfDay) {
    if (minuteOfDay === null) return "absent";
    if (minuteOfDay <= CONFIG.TIME_ON_TIME) return "ontime";
    if (minuteOfDay <= CONFIG.TIME_LATE)    return "late";
    return "half";
  }
  const STATUS_LABEL = {
    ontime: "ปกติ", late: "สาย", half: "ครึ่งวัน", absent: "ยังไม่มา"
  };

  // ── Load & process ────────────────────────────────────────
  async function loadData(force = false) {
    const btn = document.getElementById("refresh-btn");
    if (btn) { btn.classList.add("loading"); btn.textContent = "⏳ โหลด..."; }

    const data = await API.fetchAll(force);
    const today  = new Date();
    document.getElementById("today-heading").textContent =
      today.toLocaleDateString("th-TH", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    document.getElementById("today-subheading").textContent =
      `อัปเดตล่าสุด ${today.toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} น.`;

    const _isValidName = n => n && n !== "ไม่พบชื่อ" && !/ไม่พบ/.test(n);
    const _isToday = (datePart) => {
      const p = String(datePart || "").trim().split("/").map(Number);
      if (p.length < 3 || p.some(isNaN)) return false;
      let [d, m, y] = p; if (y > 2400) y -= 543;
      return d === today.getDate() && m === (today.getMonth() + 1) && y === today.getFullYear();
    };

    const nameSet = new Set();
    data.attendance.forEach(r => {
      const name = (r["เจ้าของ"] || "").trim();
      if (_isValidName(name)) nameSet.add(name);
    });
    _knownNames = [...nameSet].sort();

    const todayMap = {};
    data.attendance.forEach(row => {
      const name = (row["เจ้าของ"] || "").trim();
      if (!_isValidName(name)) return;

      const raw = String(row["เวลาเริ่มต้น"] || "");
      const parts = raw.indexOf(",") >= 0 ? raw.split(",") : raw.split(/\s+/);
      if (!_isToday(parts[0])) return;

      const timePart = (parts.slice(1).join(" ") || "").trim();
      const [hh, mm] = timePart.split(":").map(Number);
      if (isNaN(hh) || isNaN(mm)) return;

      const mins = hh * 60 + mm;
      if (!todayMap[name] || mins < todayMap[name].minuteOfDay) {
        todayMap[name] = { time: timePart.slice(0,5), minuteOfDay: mins };
      }
    });

    // Build card list
    const came   = [];
    const absent = [];
    _knownNames.forEach(name => {
      if (todayMap[name]) {
        const { time, minuteOfDay } = todayMap[name];
        came.push({ name, time, minuteOfDay, status: getStatus(minuteOfDay) });
      } else {
        absent.push({ name, time: null, minuteOfDay: null, status: "absent" });
      }
    });
    came.sort((a, b) => a.minuteOfDay - b.minuteOfDay);
    _allCards = [...came, ...absent];

    // Update summary chips
    const cnt = { ontime: 0, late: 0, half: 0, absent: 0 };
    _allCards.forEach(c => cnt[c.status]++);
    document.getElementById("cnt-ontime").textContent = cnt.ontime;
    document.getElementById("cnt-late").textContent   = cnt.late;
    document.getElementById("cnt-half").textContent   = cnt.half;
    document.getElementById("cnt-absent").textContent = cnt.absent;
    document.getElementById("cnt-total").textContent  = _knownNames.length;

    renderCards();
    _advances = data.advance || [];
    renderAdvanceSummary();
    if (btn) { btn.classList.remove("loading"); btn.textContent = "🔄 อัปเดต"; }
  }

  // ── Render cards ──────────────────────────────────────────
  function renderCards() {
    const grid = document.getElementById("today-grid");
    const list = _activeFilter === "all"
      ? _allCards
      : _allCards.filter(c => c.status === _activeFilter);

    if (list.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <span class="empty-icon">🔍</span>
        <div>ไม่พบรายการในหมวดนี้</div>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(emp => `
      <div class="emp-card status-${emp.status}">
        <div class="emp-avatar">${emp.name.charAt(0)}</div>
        <div class="emp-info">
          <div class="emp-name">${emp.name}</div>
          <div class="emp-time">
            ${emp.time
              ? `🕐 ${emp.time}`
              : `<span style="color:#ef4444">ไม่มีข้อมูล</span>`}
          </div>
        </div>
        <span class="emp-status-badge">${STATUS_LABEL[emp.status]}</span>
      </div>`).join("");
  }

  // ── Filter ────────────────────────────────────────────────
  function setFilter(filter, btn) {
    _activeFilter = filter;
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    renderCards();
  }

  // ── Advance Summary (อ่านจากชีตจริง) ─────────────────────
  function _advDateParts(ds) { // รองรับ "YYYY-MM-DD" และ "DD/MM/YYYY HH:MM:SS"
    if (!ds) return null;
    ds = String(ds).trim().split(" ")[0];
    let p;
    if (ds.indexOf("-") >= 0) p = ds.split("-").map(Number);
    else if (ds.indexOf("/") >= 0) p = ds.split("/").map(Number);
    else return null;
    if (p.length < 3 || p.some(isNaN)) return null;
    let y, m, d;
    if (p[0] > 1000) { y = p[0]; m = p[1]; d = p[2]; }   // YYYY-MM-DD
    else { d = p[0]; m = p[1]; y = p[2]; }               // DD/MM/YYYY
    if (y > 2400) y -= 543;
    return { y, m, d, sort: y * 10000 + m * 100 + d };
  }

  function renderAdvanceSummary() {
    const body  = document.getElementById("adv-summary-body");
    const badge = document.getElementById("adv-grand-total");
    if (!body) return;

    const list = _advances || [];
    if (list.length === 0) {
      body.innerHTML = `<tr><td colspan="5" class="adv-empty">
        <span class="adv-empty-icon">💸</span>
        ยังไม่มีข้อมูลการเบิกเงินล่วงหน้า<br>
        <span style="font-size:11px;color:#cbd5e1">เมื่อมีคำขอเบิก จะแสดงสรุปยอดรายคนที่นี่</span>
      </td></tr>`;
      if (badge) badge.textContent = "รวม ฿0";
      return;
    }

    // รวมยอดรายคน + แยกยังไม่โอน / โอนแล้ว
    const byName = {};
    list.forEach(r => {
      const name = (r["ชื่อพนักงาน"] || "").trim();
      if (!name) return;
      const amt  = Number(r["จำนวนเงิน (บาท)"] || r["จำนวนเงิน"] || 0) || 0;
      const paid = /โอน/.test(String(r["สถานะ"] || ""));
      const dp   = _advDateParts(r["วันที่ขอเบิก"]) || _advDateParts(r["วันที่บันทึก"]);
      if (!byName[name]) byName[name] = { total: 0, count: 0, pending: 0, latestSort: 0, latest: null };
      const o = byName[name];
      o.total += amt; o.count += 1;
      if (!paid) o.pending += amt;
      if (dp && dp.sort > o.latestSort) { o.latestSort = dp.sort; o.latest = dp; }
    });

    const rows = Object.entries(byName).sort((a, b) => b[1].total - a[1].total);
    const grandTotal   = rows.reduce((s, [, v]) => s + v.total, 0);
    const grandPending  = rows.reduce((s, [, v]) => s + v.pending, 0);
    const maxAmt       = rows[0]?.[1].total || 1;

    const MONTHS_SHORT = ["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
    function fmtDate(dp) { return dp ? `${dp.d} ${MONTHS_SHORT[(dp.m-1+12)%12]} ${dp.y+543}` : "—"; }
    function fmtNum(n) { return Number(n).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    body.innerHTML = rows.map(([name, v]) => {
      const pct = Math.round((v.total / maxAmt) * 100);
      const pendingTag = v.pending > 0
        ? `<span style="font-size:10px;color:#b45309;background:#fef3c7;padding:1px 7px;border-radius:10px;margin-left:6px">ค้างโอน ฿${fmtNum(v.pending)}</span>`
        : `<span style="font-size:10px;color:#166534;background:#dcfce7;padding:1px 7px;border-radius:10px;margin-left:6px">โอนครบ</span>`;
      return `<tr>
        <td>
          <div class="adv-name-cell">
            <div class="adv-avatar">${name.charAt(0)}</div>
            <span style="font-weight:600;color:#1e3a5f">${name}</span>${pendingTag}
          </div>
        </td>
        <td style="text-align:center"><span class="adv-count-badge">${v.count} ครั้ง</span></td>
        <td class="adv-amount-cell">฿${fmtNum(v.total)}</td>
        <td><div class="adv-bar-wrap"><div class="adv-bar-fill" style="width:${pct}%"></div></div></td>
        <td style="color:#64748b;white-space:nowrap">${fmtDate(v.latest)}</td>
      </tr>`;
    }).join("");

    if (badge) badge.textContent = grandPending > 0
      ? `รวม ฿${fmtNum(grandTotal)} • ค้างโอน ฿${fmtNum(grandPending)}`
      : `รวม ฿${fmtNum(grandTotal)}`;
  }

  // ── Auto refresh every 2 min ──────────────────────────────
  window.addEventListener("load", () => { loadData(); });
  setInterval(() => loadData(true), 120_000);

  // กลับมาที่หน้านี้ → รีเฟรชข้อมูล (รวมสรุปการเบิก)
  window.addEventListener("focus", () => loadData(true));
</script>
</body>
</html>
